# ─────────────────────────────────────────────────────────────
#  CI — 코드가 올라올 때마다 GitHub가 자동으로 빌드·타입체크
#  (서버 불필요. 배포는 하지 않고 "깨진 코드가 main에 들어오는 것"만 막는다.)
#  자세한 설명: docs/90-architecture/ci-cd-github-actions.md
# ─────────────────────────────────────────────────────────────
name: CI

# 언제 실행할지 — main 푸시 + 모든 PR
on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에서 새 커밋이 올라오면 이전 실행은 취소(낭비 방지)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 실제 IP 가 저장소에 섞여 들어오는 것을 막는다 (2026-09-02).
  # .githooks/pre-commit 과 같은 검사 — 훅을 켜지 않았거나 --no-verify 로
  # 우회한 커밋도 여기서 걸린다. 체크아웃만 하므로 20초면 끝난다.
  sanitize:
    name: 실제 IP 유출 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 실제 IP 대역 검사
        run: |
          # 검사기 자신(훅·이 워크플로)은 안내 문구에 대역을 평문으로
          # 들고 있으므로 제외한다.
          if git grep -nIE '192\.168\.94\.|58\.230\.60\.|218\.232\.94\.' \
               -- . ':(exclude).githooks/pre-commit' \
                    ':(exclude).github/workflows/ci.yml'; then
            echo
            echo '❌ 실제 IP 가 저장소에 있습니다. sanitize 규약값으로 바꾸십시오.'
            echo '   192.168.94.x  -> 192.168.0.x   (끝자리는 그대로 둔다)'
            echo '   58.230.60.22  -> 203.0.113.9   (접속자 예시)'
            echo '   218.232.94.74 -> 203.0.113.10  (FortiGate 공인)'
            exit 1
          fi
          echo '✅ 실제 IP 없음'

  # 카탈로그 번호가 겹치는 것을 막는다 (2026-09-04).
  #
  # 번호를 PR 작성자가 손으로 잡는데, **동시에 열린 PR 은 서로를 못 본다.**
  # 병합 순서에 따라 누가 먼저 가져갈지가 정해져서, 실제로 세 번 겹쳤다
  #   · e2e186  #369 · #371 이 각자 가져가 둘 다 병합됐다
  #   · e2e188  #372 작업 중 #373 이 먼저 가져갔다
  #   · e2e189  #372 작업 중 #374 가 먼저 가져갔다
  # 앞의 둘은 사람이 알아채지 못한 채 main 에 들어갔다 — **눈으로 잡는
  # 데 기대면 안 된다.** 체크아웃만 하므로 20초면 끝난다.
  catalog:
    name: 테스트 카탈로그 번호 중복 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: e2e 번호 중복 검사
        run: |
          CAT=docs/05-implementation/test-catalog.md
          # 표의 첫 칸(`| e2eNNN |`)만 본다 — 본문 안의 참조는 겹쳐도 된다
          DUP=$(grep -o '^| e2e[0-9]\+ |' "$CAT" | sort | uniq -d)
          if [ -n "$DUP" ]; then
            echo '❌ 같은 e2e 번호가 여러 표 행에 있습니다:'
            echo "$DUP"
            echo
            echo '   다음 빈 번호로 옮기십시오. 옮길 쪽을 고를 때는'
            echo '   **다른 문서가 참조하지 않는 쪽**을 옮기면 교차 참조를'
            echo '   안 건드립니다:'
            echo '     grep -rn "e2eNNN" docs/ | grep -v test-catalog'
            echo
            echo -n '   지금 가장 큰 번호: '
            grep -o '^| e2e[0-9]\+' "$CAT" | grep -o '[0-9]\+' | sort -n | tail -1
            exit 1
          fi
          echo -n '✅ e2e 번호 중복 없음 — 행 '
          grep -c '^| e2e[0-9]\+ |' "$CAT"

  # EMM 파서 복사본이 원본과 어긋나는 것을 막는다 (2026-09-04).
  #
  # apps/api/src/emm/ 은 packages/emm-parser/src/ 의 **복사본**이다. API 는
  # Nixpacks + Base Directory `apps/api` 로 빌드돼 `packages/` 가 컨텍스트
  # 밖이고(dev-server-coolify.md §5.2), 그 패키지는 아직 npm 에 없다.
  # 그래서 복사해 두되 **갈라질 수는 없게** 여기서 막는다 — 원본을 고치고
  # 복사본을 잊으면 MCP 의 `create_map` 만 옛 규칙으로 도는 일이 생긴다.
  #   고치는 법:  cd apps/api && npm run sync:emm  → 결과를 커밋
  emm-parser-copy:
    name: EMM 파서 복사본 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: apps/api/src/emm 이 원본과 같은가
        run: cd apps/api && npm run check:emm

  frontend:
    name: 프론트엔드 빌드 · 타입체크
    runs-on: ubuntu-latest          # GitHub이 빌려주는 리눅스 가상머신
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      # 1) 저장소 코드를 러너로 내려받기
      - uses: actions/checkout@v4

      # 2) Node 20 설치 + npm 캐시(다음 실행부터 빨라짐)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # 3) 락파일 그대로 정확히 설치(npm ci = 재현 가능한 설치)
      - name: 의존성 설치
        run: npm ci

      # 4) 타입 검사 — 타입 오류가 있으면 여기서 빨간 X
      - name: 타입 체크
        run: npm run type-check
      # 프런트 순수 함수 단위 테스트 (2026-09-05) — EMM 선언 해석 · AI 덧붙이기 합치기
      - name: 단위 테스트 (emmDeclaration · mergeAppends)
        run: npm run test:unit

      # 5) 프로덕션 빌드 — 실제 빌드가 깨지지 않는지 확인
      - name: 프로덕션 빌드
        run: npm run build

  backend:
    name: 백엔드 빌드 · 타입체크 · 스모크(DB)
    runs-on: ubuntu-latest
    # 잡 실행 동안만 살아있는 임시 PostgreSQL 16 (ltree 포함)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: emm
          POSTGRES_PASSWORD: emm
          POSTGRES_DB: easymindmap
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emm -d easymindmap"
          --health-interval 5s --health-timeout 3s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - name: 의존성 설치
        run: npm ci
      - name: 타입 체크
        run: npm run type-check
      - name: 빌드
        run: npm run build
      - name: AI 키 암호화 단위 테스트 (2026-09-04)
        run: npm run test:ai-keys
      # MCP 커넥터 단위 테스트 (2026-09-04) — EMM→스냅샷 변환 · JSON-RPC 계층
      - name: MCP 단위 테스트
        run: npm run test:mcp
      # 표 존재 판정의 **캐시 정책** (2026-09-05). "없다"를 얼마나 기억하는지가
      # 관리자 경험을 바꾼다 — 기억하면 델타를 넣고도 1분간 화면이 그대로다.
      # 자주 불리는 자리는 기억하고, 델타 직후 확인하는 자리는 매번 묻는다.
      - name: 표 존재 판정(tableReady) 단위 테스트
        run: npm run test:table-ready
      # 버전 정리 계획(13a §2) — 무엇을 지울지 정하는 순수 함수. DB 없이 돈다.
      - name: 버전 정리 계획(version-prune) 단위 테스트
        run: npm run test:version-prune
      - name: DB 스키마 로드 (shim → schema → functions → seed)
        env:
          PGPASSWORD: emm
        run: |
          for f in database/dev/00-supabase-shim.sql database/schema.sql \
                   database/functions/move_node_subtree.sql database/dev/01-seed-dev-user.sql; do
            psql -h localhost -U emm -d easymindmap -v ON_ERROR_STOP=1 -q -f "$f"
          done
      - name: API 기동 + 맵 CRUD 스모크
        env:
          DATABASE_URL: postgres://emm:emm@localhost:5432/easymindmap
          AUTH_MODE: dev
          PORT: '3000'
          # AI 키 보관 왕복(스모크)이 켜진 경로를 타도록 — 값은 CI 전용
          AI_KEY_SECRET: ci-only-ai-key-secret-0123456789
        run: |
          node dist/main.js & echo $! > /tmp/api.pid
          for i in $(seq 1 30); do curl -sf http://localhost:3000/v1/health && break; sleep 1; done
          # 헬스체크가 스키마 최신 여부까지 확인한다 (schema:'ok')
          curl -sf http://localhost:3000/v1/health | grep -q '"schema":"ok"' \
            || { echo 'schema 가 ok 가 아닙니다 — schema.sql 과 REQUIRED_TABLES 확인'; exit 1; }
          API_URL=http://localhost:3000 npm run smoke
          kill "$(cat /tmp/api.pid)" || true
      # 델타 SQL 미적용 서버에서 **어떻게 물러나는가** (2026-09-04).
      # 표를 잠깐 치워 두고 응답을 본다 — 코드를 읽어서는 못 잡는 자리다
      # (`err.code === '42P01'` 검사가 죽은 코드였던 것을 여기서 잡았다).
      # 표는 rename 으로 치웠다가 반드시 되돌린다 — 지우지 않는다.
      - name: 스키마 미적용 물러남 테스트
        env:
          DATABASE_URL: postgres://emm:emm@localhost:5432/easymindmap
          DEGRADE_PORT: '3020'
        run: npm run test:schema-degrade

      # AUTH_MODE=supabase 부팅 스모크 (2026-08-01 배포 실패 재발 방지).
      # dev 모드만 검증하던 탓에 auth.guard 의 ESM 전용 의존성(jose)
      # require 실패를 CI 가 잡지 못하고 배포에서 터졌다.
      # --no-experimental-require-module: Node 22+ 에서도 낮은 Node 와
      # 동일하게 require(ESM) 을 금지해 컨테이너 환경을 재현한다.
      - name: API supabase 모드 부팅 스모크 (ESM require 금지)
        env:
          DATABASE_URL: postgres://emm:emm@localhost:5432/easymindmap
          AUTH_MODE: supabase
          SUPABASE_JWT_SECRET: ci-only-dummy-secret-0123456789abcdef
          PORT: '3010'
        run: |
          NODE_MAJOR="$(node -p 'process.versions.node.split(".")[0]')"
          FLAG=""
          if [ "$NODE_MAJOR" -ge 22 ]; then FLAG="--no-experimental-require-module"; fi
          node $FLAG dist/main.js & echo $! > /tmp/api-sb.pid
          for i in $(seq 1 30); do curl -sf http://localhost:3010/v1/health && break; sleep 1; done
          # 인증이 켜졌는지: 토큰 없는 보호 엔드포인트는 401 이어야 한다
          code="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3010/v1/maps)"
          kill "$(cat /tmp/api-sb.pid)" || true
          test "$code" = "401" || { echo "기대 401, 실제 $code"; exit 1; }
