# ─────────────────────────────────────────────────────────────
#  CI — 코드가 올라올 때마다 GitHub가 자동으로 빌드·타입체크
#  (서버 불필요. 배포는 하지 않고 "깨진 코드가 main에 들어오는 것"만 막는다.)
#  자세한 설명: docs/90-architecture/ci-cd-github-actions.md
# ─────────────────────────────────────────────────────────────
name: CI

# 언제 실행할지 — main 푸시 + 모든 PR
on:
  push:
    branches: [main]
  pull_request:

# 같은 브랜치에서 새 커밋이 올라오면 이전 실행은 취소(낭비 방지)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: 프론트엔드 빌드 · 타입체크
    runs-on: ubuntu-latest          # GitHub이 빌려주는 리눅스 가상머신
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      # 1) 저장소 코드를 러너로 내려받기
      - uses: actions/checkout@v4

      # 2) Node 20 설치 + npm 캐시(다음 실행부터 빨라짐)
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      # 3) 락파일 그대로 정확히 설치(npm ci = 재현 가능한 설치)
      - name: 의존성 설치
        run: npm ci

      # 4) 타입 검사 — 타입 오류가 있으면 여기서 빨간 X
      - name: 타입 체크
        run: npm run type-check

      # 5) 프로덕션 빌드 — 실제 빌드가 깨지지 않는지 확인
      - name: 프로덕션 빌드
        run: npm run build
