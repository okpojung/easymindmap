<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <!-- EasyMindMap 로고 파비콘 (2026-08 v3 — 사용자 제공 원본 벡터 SVG).
         원본 파일 = src/assets/brand-logo.svg (docs/assets/brand/logo.svg와
         동일 바이트). I.Logo·뷰어 LOGO_SVG도 같은 파일을 import 한다 —
         로고를 바꿀 때는 그 SVG 파일만 교체하면 된다 (brand-logo.md). -->
    <link rel="icon" type="image/svg+xml" href="/src/assets/brand-logo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" />
    <link rel="stylesheet"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <!-- 퍼블리싱 링크(/p/{id})의 머리말이 여기서 채워진다 (2026-09-06).
         nginx 가 그 경로에서만 SSI 를 켜고 API 의 og.html 을 끼워 넣는다
         (apps/frontend/nginx.conf · apps/api/src/publish/og-tags.ts).
         다른 경로에서는 그냥 주석이라 아무 일도 일어나지 않는다.
         아래 제목 줄보다 먼저 두는 것이 중요하다 — 조각이 자기 제목을
         내주고, 브라우저와 크롤러는 처음 것을 쓴다.
         주석 안에 태그 모양(꺾쇠)을 쓰지 않는다: 크롤러가 주석을 걷어내지
         못하면 그 글자를 제목으로 잘못 집을 수 있다. -->
    <!--# include virtual="/__og$request_uri" -->
    <title>EasyMindMap · Editor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
