# EasyMindMap 프런트엔드 nginx.
#
# ★ **이 파일은 템플릿이다** (2026-09-06). `${API_ORIGIN}` 이 들어 있어서
#   `/etc/nginx/templates/default.conf.template` 로 넣어야 한다 — 공식
#   nginx 이미지가 기동할 때 envsubst 로 채운다. `conf.d/` 에 그대로 넣으면
#   `${API_ORIGIN}` 이 글자 그대로 남아 **nginx 가 뜨지 않는다.**
#   (Dockerfile · Dockerfile.frontend 두 곳 모두 그렇게 넣는다.)

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # 이름에 해시가 붙은 자산 — 내용이 바뀌면 **파일 이름이 바뀐다**.
    # 그러니 오래 캐시해도 낡을 수가 없다.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── 퍼블리싱 링크 `/p/{id}` — **여기서만 `<head>` 를 채운다** (2026-09-06)
    #
    # 무엇이 문제였나: `/p/{id}` 는 SPA 라 내용을 브라우저가 그린다.
    # 크롤러는 대부분 자바스크립트를 실행하지 않으므로, 어느 맵을
    # 붙여넣어도 카카오·슬랙에 **같은 제목 하나**(`EasyMindMap · Editor`)만
    # 잡혔다(실측 2026-09-06).
    #
    # 어떻게 고치나: **페이지는 그대로 두고 조각만 끼워 넣는다.** nginx 가
    # index.html 을 내보내면서 SSI 로 API 의 `og.html` 을 불러 `<head>` 에
    # 넣는다. 서버가 페이지를 통째로 만들지 않으므로 **번들 파일 이름(해시)을
    # 서버가 알 필요가 없다** — 배포마다 맞출 것이 없다.
    location ^~ /p/ {
        ssi on;
        # ★ **실패하면 조용히 넘어간다.** API 가 죽었거나 그 맵이 보관
        #   (비공개)이면 조각이 404 인데, 그때 nginx 가 기본값으로
        #   "[an error occurred...]" 를 **페이지에 박아 넣는다.**
        #   지금과 똑같은 화면이 되는 편이 맞다.
        ssi_silent_errors on;
        try_files /index.html =404;
        add_header Cache-Control "no-store";
    }

    # 조각을 가져오는 자리 — **바깥에서 직접 부를 수 없다**(`internal`).
    # SSI 가 `/__og$request_uri` 로 부르므로 `/__og/p/{id}` 로 들어온다.
    location ^~ /__og/p/ {
        internal;
        # 슬러그 모양일 때만 API 로 넘긴다. 아니면 그대로 넘어가 404 →
        # `ssi_silent_errors` 가 삼킨다.
        # 정규식을 **따옴표로 감싼다** — `{6,20}` 의 중괄호를 nginx 가
        #   블록 시작으로 읽어 "not terminated by ;" 로 죽는다(실측).
        rewrite "^/__og/p/([a-z0-9]{6,20})$" /v1/published/$1/og.html break;
        proxy_pass ${API_ORIGIN};
        proxy_ssl_server_name on;              # https 상류의 SNI
        proxy_set_header Host $proxy_host;
        # API 가 카드 주소(og:url)를 만들 때 쓴다 — 이 헤더는 우리가 붙인다.
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;

        # ★ **압축된 바이트를 머리말에 박지 않는다** (2026-09-11 실측).
        #
        #   nginx 는 클라이언트의 `Accept-Encoding` 을 서브요청에도 그대로
        #   넘긴다. 크롤러는 거의 전부 `gzip` 을 보내므로 API 가 조각을
        #   **gzip 으로** 돌려주고, nginx 는 그 바이트를 **풀지 않고**
        #   `<head>` 안에 끼워 넣는다 — 카드가 통째로 깨진다.
        #   (실측: `Accept-Encoding: gzip` 이면 `og:title` **0개**,
        #    없거나 `identity` 면 1개.)
        #
        #   빈 값으로 덮어 **압축하지 말라**고 이른다. 조각은 2KB 남짓이라
        #   압축해서 얻을 것도 없다.
        proxy_set_header Accept-Encoding "";

        # 조각 하나 때문에 페이지가 늦어지면 안 된다.
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;

        # ★ **상류의 오류 '페이지' 를 머리말에 박지 않는다** (2026-09-06 실측).
        #
        #   `ssi_silent_errors` 는 nginx 자신의 SSI 오류 문구만 지운다.
        #   API 가 죽으면 nginx 는 **자기 502 페이지(완전한 HTML 문서)** 를
        #   조각으로 삼아 `<head>` 안에 통째로 끼워 넣는다 — 실제로
        #   `<title>502 Bad Gateway</title>` 가 맵 제목보다 먼저 들어갔다.
        #   그러면 카드에 "502 Bad Gateway" 가 뜬다.
        #
        #   그래서 상류 오류를 가로채 **빈 응답**으로 바꾼다. 조각이 비면
        #   index.html 의 원래 머리말이 그대로 남는다(지금과 같은 화면).
        proxy_intercept_errors on;
        error_page 400 401 403 404 408 500 502 503 504 = @og_none;
    }

    # 조각을 못 받았을 때 — **아무것도 넣지 않는다** (본문 없는 204)
    location @og_none {
        internal;
        return 204;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # ★ **index.html 은 절대 캐시하지 않는다** (2026-08-20).
        #
        #   전에는 이 헤더를 `location = /index.html` 에만 걸어 뒀는데,
        #   주소창에 `/` 로 들어오면 **여기의 try_files 가** index.html 을
        #   내보내므로 그 블록을 타지 않는다. 그래서 브라우저가 낡은
        #   index.html 을 들고 있게 되고, 그것이 **옛 번들 파일 이름**을
        #   가리킨다 — **재배포를 해도 옛 화면이 그대로 뜬다.**
        #
        #   실제로 그 함정에 걸렸다: 고쳐서 배포했는데 사용자 화면은
        #   그대로였고, 원인을 코드에서 찾느라 몇 번을 헛돌았다.
        add_header Cache-Control "no-store";
    }
}
