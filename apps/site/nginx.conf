# EasyMindMap 홈페이지 (www.easymindmap.org) — 2026-09-13
#
# ★ **한 도메인 안에 두 앱이 산다** (B안, 사용자 결정 2026-09-12).
#
#     /                → 이 홈페이지 (소개 · 퍼블리싱맵 목록)
#     /site-assets/…   → 이 홈페이지의 번들
#     /p/{id}          → **기존 앱으로 넘긴다** (퍼블리싱 공개 뷰어)
#     /assets/…        → 그 앱의 번들 (뷰어가 부른다)
#
#   손님이 진열대에서 맵으로 갈 때 **도메인이 바뀌지 않게** 하려는 것이다.
#   뷰어를 이 앱에 복제하지 않는 이유: 뷰어는 내보내기 HTML 생성기
#   (`exportHtml.ts`)와 레이아웃 엔진을 통째로 쓴다. 복제하면 두 벌이
#   갈라지고, 갈라지면 "앱에서는 멀쩡한데 홈페이지에서는 깨진" 표
#   같은 사고가 난다(실제로 겪었다 — e2e255).
#
# ⚠️ 이 파일은 **템플릿**이다 — `${APP_ORIGIN}` 이 들어 있어서
#    `/etc/nginx/templates/default.conf.template` 로 넣어야 한다.
#    `conf.d/` 에 그대로 넣으면 그 글자가 남아 nginx 가 뜨지 않는다.

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # 홈페이지 번들 — 이름에 해시가 들어 있어 길게 캐시해도 안전하다.
    #
    # ★ `alias` 다, `root` 가 아니다. vite 가 `base: '/site-assets/'` 로
    #   **주소만** 바꾸고 파일은 dist 뿌리에 낸다(`assetsDir: '.'`). `root`
    #   면 `/site-assets/x.js` 를 `…/html/site-assets/x.js` 에서 찾아 404 가
    #   된다 — 실측으로 잡았다.
    #   `try_files` 는 쓰지 않는다 — `alias` 와 함께 쓰면 `$uri` 를 alias 가
    #   아니라 root 기준으로 푸는 판이 있다(nginx 의 오래된 함정). 없는
    #   파일은 alias 만으로도 404 다.
    location ^~ /site-assets/ {
        alias /usr/share/nginx/html/;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── 퍼블리싱 공개 뷰어 — 기존 앱이 그린다 ─────────────────────
    #
    # 앱의 nginx 가 그 경로에서 SSI 로 링크 카드 조각을 끼워 넣는다.
    # 그래서 **여기서 다시 조각을 만들지 않는다** — 배관이 한 벌뿐이라
    # 어긋날 자리가 없다.
    location ^~ /p/ {
        proxy_pass ${APP_ORIGIN};
        proxy_ssl_server_name on;                 # https 상류의 SNI
        proxy_set_header Host $proxy_host;        # 상류의 라우팅은 그 이름으로
        # ★ 카드 주소(og:url)는 **손님이 보는 도메인**이어야 한다.
        #   앱은 이 헤더로 주소를 만든다(publish.controller 의 appOrigin).
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # 뷰어가 부르는 앱 번들 — 같은 상류로 넘긴다
    location ^~ /assets/ {
        proxy_pass ${APP_ORIGIN};
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }

    # ── 홈페이지 ──────────────────────────────────────────────────
    # SPA 라 없는 경로도 index.html 로 보낸다(길잡이가 고른다).
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }
}
