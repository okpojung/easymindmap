<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" fill="none">
  <!-- EasyMindMap 브랜드 로고 (2026-08 v2 — 원본 1024px 도안 실측 재현).
       사용처·수정 규칙은 docs/assets/brand/brand-logo.md 참조. -->
  <defs>
    <linearGradient id="emmg" x1="0.35" y1="0" x2="0.25" y2="1">
      <stop offset="0" stop-color="#F0AC1F"/>
      <stop offset="0.5" stop-color="#EC8B10"/>
      <stop offset="1" stop-color="#E1650D"/>
    </linearGradient>
  </defs>
  <rect width="1024" height="1024" fill="#FFFFFF"/>
  <!-- 'e' 링 — 중심 (345,540), 반지름 212, 두께 56. 시작 = 크로스바
       높이(y470)의 오른쪽, 반시계로 돌아 오른쪽 아래(약 5시)에서 열림 -->
  <path d="M 545 470 A 212 212 0 1 0 445 727"
    stroke="url(#emmg)" stroke-width="56" stroke-linecap="butt"/>
  <!-- 'e' 크로스바 — Mark 줄 높이에서 링 안쪽으로 들어가는 직선 -->
  <path d="M 468 470 L 585 470" stroke="url(#emmg)" stroke-width="56" stroke-linecap="butt"/>
  <!-- Mark / Down — 링 안쪽, 크로스바(Mark 줄)·중심 점(Down 줄)과 정렬 -->
  <text x="225" y="506" font-family="Pretendard,-apple-system,sans-serif"
    font-weight="800" font-size="104" fill="#5C3B25">Mark</text>
  <text x="200" y="631" font-family="Pretendard,-apple-system,sans-serif"
    font-weight="800" font-size="104" fill="#5C3B25">Down</text>
  <!-- 중심 점 (Down 오른쪽) + 트리 -->
  <circle cx="515" cy="595" r="36" fill="url(#emmg)"/>
  <path d="M 549 595 C 645 595 628 470 700 470 L 812 470"
    stroke="url(#emmg)" stroke-width="28" stroke-linecap="round"/>
  <path d="M 549 595 C 645 595 628 700 700 700 L 812 700"
    stroke="url(#emmg)" stroke-width="28" stroke-linecap="round"/>
  <path d="M 735 470 L 735 244 L 812 244" stroke="url(#emmg)" stroke-width="28"
    stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 735 356 L 812 356" stroke="url(#emmg)" stroke-width="28" stroke-linecap="round"/>
  <path d="M 735 700 L 735 830 L 812 830" stroke="url(#emmg)" stroke-width="28"
    stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="850" cy="244" r="36" fill="url(#emmg)"/>
  <circle cx="850" cy="356" r="36" fill="url(#emmg)"/>
  <circle cx="850" cy="470" r="36" fill="url(#emmg)"/>
  <circle cx="850" cy="700" r="36" fill="url(#emmg)"/>
  <circle cx="850" cy="830" r="36" fill="url(#emmg)"/>
</svg>
